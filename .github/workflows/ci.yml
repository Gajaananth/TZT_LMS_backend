name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Type-check, Lint, Test, Build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: tzit_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/tzit_lms_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/tzit_lms_test?schema=public"
      SUPABASE_URL: "https://mock-project.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key-mock-service-role-key-mock-service-role-key"
      JWT_SECRET: "ci-secret-for-testing-only-1234567890"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate --schema src/db/prisma/schema.prisma

      - name: Run Backend Type-check
        run: npm run type-check --workspace=backend

      - name: Run Backend Lint
        run: npm run lint --workspace=backend
        continue-on-error: true

      - name: Run Backend Tests
        run: npm run test --workspace=backend

      - name: Run Backend Build
        run: npm run build --workspace=backend

  frontend:
    name: Frontend (Type-check, Lint, Build)
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: "https://mock-project.supabase.co"
      VITE_SUPABASE_ANON_KEY: "mock-anon-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Type-check
        run: npm run type-check --workspace=frontend

      - name: Run Frontend Lint
        run: npm run lint --workspace=frontend
        continue-on-error: true

      - name: Run Frontend Build
        run: npm run build --workspace=frontend
